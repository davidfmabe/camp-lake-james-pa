<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camp Lake James PA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2efe6;
      color: #172019;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    .eyebrow {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      opacity: .6;
    }
    h1 {
      margin: 8px 0 4px;
      font-size: 38px;
      line-height: 1;
    }
    .subhead {
      margin: 0 0 28px;
      opacity: .7;
    }
    .panel {
      background: white;
      border: 2px solid #172019;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 6px 6px 0 #172019;
    }
    label {
      display: block;
      font-weight: 800;
      margin-bottom: 8px;
    }
    textarea, select {
      width: 100%;
      font: inherit;
      font-size: 17px;
      border: 2px solid #172019;
      border-radius: 12px;
      padding: 13px;
      background: #fff;
    }
    textarea {
      min-height: 150px;
      resize: vertical;
    }
    select {
      margin-bottom: 18px;
    }
    .counter {
      text-align: right;
      font-size: 13px;
      opacity: .6;
      margin: 6px 2px 18px;
    }
    button {
      width: 100%;
      min-height: 58px;
      border: 2px solid #172019;
      border-radius: 14px;
      background: #d84b35;
      color: white;
      font: inherit;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: .05em;
      cursor: pointer;
      box-shadow: 4px 4px 0 #172019;
    }
    button:disabled {
      opacity: .5;
      cursor: wait;
    }
    #status {
      min-height: 24px;
      margin-top: 18px;
      font-weight: 700;
      text-align: center;
    }
    .fineprint {
      margin-top: 24px;
      font-size: 12px;
      text-align: center;
      opacity: .55;
    }
  </style>
</head>
<body>
  <main>
    <h1>Camp Lake James PA</h1>
    <p class="subhead">Please announce responsibly.</p>

    <div class="panel">
      <label for="text">Announcement</label>
      <textarea id="text" maxlength="500" placeholder="Attention Camp Lake James..."></textarea>

      <div class="counter"><span id="count">0</span> / 500</div>

      <label for="voice">Voice</label>
      <select id="voice">
        <option value="iBeucLPI8hr8MOJjjYTL" selected>Public Address</option>
        <option value="34lPwSZ54D8fWbX1aHzk">Radio Announcer</option>
        <option value="aOcS60CY8CoaVaZfqqb5">Cowboy</option>
        <option value="55AvudlJMfCwL9pocDVh">British Robot</option>
        <option value="3hm20PbqnREBI8WdrIzx">AI Receptionist</option>
      </select>

      <button id="broadcast">BROADCAST</button>
      <div id="status" aria-live="polite"></div>
    </div>

    <div class="fineprint">
      Announcements do not necessarily reflect the beliefs or opinions of Camp Lake James, its parent company, or its subsidiaries.
    </div>
  </main>

  <script>
    const WORKER = "https://camp-lake-james-pa.david-f-mabe.workers.dev";
    const params = new URLSearchParams(window.location.hash.slice(1));
    const ACCESS_KEY = params.get("key") || "";

    const text = document.getElementById("text");
    const voice = document.getElementById("voice");
    const button = document.getElementById("broadcast");
    const status = document.getElementById("status");
    const count = document.getElementById("count");

    text.addEventListener("input", () => {
      count.textContent = text.value.length;
    });

    button.addEventListener("click", async () => {
      const message = text.value.trim();

      if (!message) {
        status.textContent = "You have to announce something.";
        return;
      }

      button.disabled = true;
      button.textContent = "TRANSMITTING...";
      status.textContent = "";

      try {
        const response = await fetch(`${WORKER}/announce`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-PA-Key": ACCESS_KEY
          },
          body: JSON.stringify({
            text: message,
            voice_id: voice.value
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Broadcast failed.");
        }

        status.textContent = `Announcement #${result.id} entered the broadcast queue.`;
        text.value = "";
        count.textContent = "0";
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      } finally {
        button.disabled = false;
        button.textContent = "BROADCAST";
      }
    });
  </script>
</body>
</html>
